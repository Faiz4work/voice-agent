services:
  - type: web
    name: reception-studio
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ADMIN_API_KEY
        generateValue: true
      - key: VAPI_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CHAT_PROVIDER
        value: groq
      - key: OPENAI_API_KEY
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_HVAC_ASSISTANT_ID
        sync: false
